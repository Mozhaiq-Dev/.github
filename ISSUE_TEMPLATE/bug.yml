name: "🐛 Bug"
description: Something isn't working as expected
title: "[🐞Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual (What Happened)
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
